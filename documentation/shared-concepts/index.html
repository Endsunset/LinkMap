<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Shared Concepts</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Projects and Locations appear in both the iOS app and the web map. Use the iOS app to manage them, then open the web map to explore the places available to your account." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Shared Concepts</li></ul><p>LinkMap Guide</p><h1>Shared Concepts</h1><p>Projects and Locations appear in both the iOS app and the web map. Use the iOS app to manage them, then open the web map to explore the places available to your account.</p></section><h2>Topics</h2><h3>Organize and Share</h3><ul><li><a href="../projects-and-activities/index.html"><p>Projects and Activities</p></a><p>A Project keeps the places for an area or shared effort together. An Activity plans one round of work using those places, with Assignments and Routes for the people involved.</p></li><li><a href="../places-and-routes/index.html"><p>Places and Routes</p></a><p>Locations are places you can reuse across Activities in a Project. Regions group broad areas, while Layers help describe levels or surfaces within them. A Route puts those places in the order you want to visit them.</p></li><li><a href="../collaboration/index.html"><p>Collaboration</p></a><p>A Project is the unit of sharing. Its owner can invite collaborators to the same Project, including its map and active Activity data. A collaborator accepts a link or scans a QR code in the iOS app, then chooses the shared Project in Context.</p></li></ul></article></noscript><div id="app"></div></body></html>
