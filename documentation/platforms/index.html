<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Platforms</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="LinkMap is available as an iOS app and a web map. Both can show the Projects and places available to you, but account access and available actions differ." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Platforms</li></ul><p>LinkMap Guide</p><h1>Platforms</h1><p>LinkMap is available as an iOS app and a web map. Both can show the Projects and places available to you, but account access and available actions differ.</p></section><h2>Topics</h2><h3>Choose a Platform</h3><ul><li><a href="../ios-platform/index.html"><p>LinkMap on iOS</p></a><p>The iOS app uses the Apple Account signed in on your device for iCloud access. You do not need to sign in separately inside LinkMap.</p></li><li><a href="../web-platform/index.html"><p>LinkMap on the Web</p></a><p>The web map asks you to sign in with your Apple Account to view your Projects and their Locations. Sign-in is a separate step in the browser, even if you already use LinkMap on iOS.</p></li></ul></article></noscript><div id="app"></div></body></html>
