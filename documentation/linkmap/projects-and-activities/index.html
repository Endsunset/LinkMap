<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Projects and Activities</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="A Project is the long-lived workspace for a map and repeated work. It owns reusable Regions, Layers, Locations, Items, and Inventory. An Activity is a shorter work cycle inside the Project, with its own Assignments, Routes, Stops, and resource history." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../shared-concepts/index.html">Shared Concepts</a></li><li>Projects and Activities</li></ul><p>Article</p><h1>Projects and Activities</h1><p>A Project is the long-lived workspace for a map and repeated work. It owns reusable Regions, Layers, Locations, Items, and Inventory. An Activity is a shorter work cycle inside the Project, with its own Assignments, Routes, Stops, and resource history.</p></section><h2>Overview</h2><p>The iOS app creates and manages both. The web app reads the Projects and Locations available to the account. This division lets the same Project map support many Activities without duplicating its places.</p></article></noscript><div id="app"></div></body></html>
