<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>LinkMap Documentation</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Learn how LinkMap organizes shared places and work, use the iOS and web apps, and understand the implementation behind them." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li>LinkMap</li></ul><p>API Collection</p><h1>LinkMap</h1><p>Learn how LinkMap organizes shared places and work, use the iOS and web apps, and understand the implementation behind them.</p></section><h2>Overview</h2><p>Start with Essentials for the common model. The handbooks contain platform-specific guidance. Shared Concepts explains the data and collaboration boundaries used by both platforms. Reference contains a small, curated set of Swift model declarations.</p><h2>Topics</h2><h3>Begin</h3><ul><li><a href="essentials/index.html"><p>Essentials</p></a><p>LinkMap centers on a Project: a shared map and a collection of Activities. Places remain available across Activities, so a team can plan another round of work without recreating its map.</p></li></ul><h3>Build and Use</h3><ul><li><a href="handbook/index.html"><p>Handbook</p></a><p>Use the iOS handbook to create and manage work in the native app. Use the web handbook to explore Projects and Locations in a browser and to understand the website implementation.</p></li></ul><h3>Common Model</h3><ul><li><a href="shared-concepts/index.html"><p>Shared Concepts</p></a><p>Both platforms refer to the same Project and Location data. The iOS app manages the full workflow; the web map reads the Project and places available to the signed-in account.</p></li></ul><h3>Selected API</h3><ul><li><a href="reference/index.html"><p>Reference</p></a><p>This section selects a few Swift models whose declarations clarify the Project and resource model. It is a curated reference, not a complete export of the app target’s internal symbols.</p></li></ul></article></noscript><div id="app"></div></body></html>
