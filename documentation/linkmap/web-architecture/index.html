<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Web Architecture</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="`app/index.html` is the map page. `app/app.js` owns the selected Project, Project list, and visible Locations. It coordinates authentication, loading, selection, retries, and updates to the map and selector. A request version discards responses that arrive after a Project switch, sign-out, or retry." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../web-handbook/index.html">Web Handbook</a></li><li><a href="../web-implementation/index.html">Web Implementation</a></li><li>Web Architecture</li></ul><p>Article</p><h1>Web Architecture</h1><p><code>app/index.html</code> is the map page. <code>app/app.js</code> owns the selected Project, Project list, and visible Locations. It coordinates authentication, loading, selection, retries, and updates to the map and selector. A request version discards responses that arrive after a Project switch, sign-out, or retry.</p></section><h2>Overview</h2><p><code>app/project.js</code> and <code>app/location.js</code> turn CloudKit records into page data. <code>app/project-selector.js</code> renders the selector and status without owning selection. <code>app/map.js</code> owns the MapKit JS instance. Search, place detail, and coordinates live in their own modules and keep their selection marker separate from Project Location annotations.</p><p>See <code>app/README.md</code> and <code>app/app.js</code> for the module boundaries and their current verification notes.</p></article></noscript><div id="app"></div></body></html>
