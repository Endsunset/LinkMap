<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>CloudKit JS</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="`cloudkit-auth.js` owns one shared authentication lifecycle for website pages and exposes a verified session state to the map. `app/cloudkit.js` reuses that container and chooses the private or shared database explicitly." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../web-handbook/index.html">Web Handbook</a></li><li><a href="../web-implementation/index.html">Web Implementation</a></li><li>CloudKit JS</li></ul><p>Article</p><h1>CloudKit JS</h1><p><code>cloudkit-auth.js</code> owns one shared authentication lifecycle for website pages and exposes a verified session state to the map. <code>app/cloudkit.js</code> reuses that container and chooses the private or shared database explicitly.</p></section><h2>Overview</h2><p>Project loading inspects private <code>projectZone-*</code> zones and accepted shared zones. A shared Project retains its complete zone identity, including owner. Location loading queries the selected Project’s zone using the Location <code>project</code> reference. Query pagination is consumed until all batches are collected.</p><p>The web map reads Project and Location records; creation, planning, and sharing controls remain in the iOS app. See <code>cloudkit-auth.js</code>, <code>app/cloudkit.js</code>, <code>app/project.js</code>, and <code>app/location.js</code>.</p></article></noscript><div id="app"></div></body></html>
