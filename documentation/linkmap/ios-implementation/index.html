<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>iOS Implementation</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="The native app is a SwiftUI application backed by private and shared CloudKit Project data. MapKit renders the selected Project context. Domain-specific CloudKit helpers handle persistence, while views own the data they display." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../ios-handbook/index.html">iOS Handbook</a></li><li>iOS Implementation</li></ul><p>API Collection</p><h1>iOS Implementation</h1><p>The native app is a SwiftUI application backed by private and shared CloudKit Project data. MapKit renders the selected Project context. Domain-specific CloudKit helpers handle persistence, while views own the data they display.</p></section><h2>Overview</h2><p>The implementation notes below describe boundaries and workflows, not every internal symbol.</p><h2>Topics</h2><h3>App Structure</h3><ul><li><a href="../swiftui-architecture/index.html"><p>SwiftUI Architecture</p></a><p><code>MapView</code> is the app’s primary route. It owns map presentation, the selected Project/Activity/Assignment context, and the coordination of Dashboard, creation, scanner, style, and Location detail sheets. <code>MapContextController</code> keeps the three selections consistent: changing Project clears Activity and Assignment; changing Activity clears Assignment.</p></li><li><a href="../ios-cloudkit/index.html"><p>CloudKit on iOS</p></a><p>Each Project is the root of one private or shared CloudKit hierarchy in a custom <code>projectZone-*</code> zone. A Project share grants collaborators access to its active child records. <code>CKUtility</code> extensions divide read and write work by domain: Project, Location, Activity, Route, Assignment, Transaction, and sharing.</p></li><li><a href="../ios-mapkit/index.html"><p>MapKit on iOS</p></a><p><code>MapView</code> uses SwiftUI’s MapKit <code>Map</code> and <code>MapReader</code>. <code>MapViewModel</code> supplies the camera, Project Locations, selected Activity routes, Assignment filtering, and the current editing state.</p></li></ul><h3>Resource Work</h3><ul><li><a href="../resource-workflows/index.html"><p>Resource Workflows</p></a><p>The native Project contains reusable Items and Inventory. An Activity, Assignment, or Stop can also hold Item quantities. A balance is derived from Transactions moving an Item into or out of one of those anchors; quantities are not stored directly on the anchor.</p></li></ul></article></noscript><div id="app"></div></body></html>
