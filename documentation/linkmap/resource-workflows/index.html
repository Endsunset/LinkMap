<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Resource Workflows</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="The native Project contains reusable Items and Inventory. An Activity, Assignment, or Stop can also hold Item quantities. A balance is derived from Transactions moving an Item into or out of one of those anchors; quantities are not stored directly on the anchor." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../ios-handbook/index.html">iOS Handbook</a></li><li><a href="../ios-implementation/index.html">iOS Implementation</a></li><li>Resource Workflows</li></ul><p>Article</p><h1>Resource Workflows</h1><p>The native Project contains reusable Items and Inventory. An Activity, Assignment, or Stop can also hold Item quantities. A balance is derived from Transactions moving an Item into or out of one of those anchors; quantities are not stored directly on the anchor.</p></section><h2>Overview</h2><p>A Transaction has one Item, a positive quantity, optional source and destination, and a note. Project-level flows connect Outside and Inventory, two Inventories, or Inventory and Activity. Activity-level flows connect Activity, Assignment, and Stop anchors within the same Activity. The direction matters: the active transaction identity is Item plus source plus destination.</p><p><code>ResourceCentreView</code> presents Project-wide and contextual resource pivots and owns balance, history, and correction workflows. Activity preparation can draft movements from Inventory to Activity and then to Assignment; the workflow validates projected balances before saving. See <code>ARCHITECTURE.md</code>, <code>WORKFLOW.md</code>, <code>LinkMap/Utilities/CKUtility/CKUtility+Transaction.swift</code>, and the Resource Centre views in LinkMap-core.</p></article></noscript><div id="app"></div></body></html>
