<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>CloudKit on iOS</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Each Project is the root of one private or shared CloudKit hierarchy in a custom `projectZone-*` zone. A Project share grants collaborators access to its active child records. `CKUtility` extensions divide read and write work by domain: Project, Location, Activity, Route, Assignment, Transaction, and sharing." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../ios-handbook/index.html">iOS Handbook</a></li><li><a href="../ios-implementation/index.html">iOS Implementation</a></li><li>CloudKit on iOS</li></ul><p>Article</p><h1>CloudKit on iOS</h1><p>Each Project is the root of one private or shared CloudKit hierarchy in a custom <code>projectZone-*</code> zone. A Project share grants collaborators access to its active child records. <code>CKUtility</code> extensions divide read and write work by domain: Project, Location, Activity, Route, Assignment, Transaction, and sharing.</p></section><h2>Overview</h2><p>The private and shared databases remain separate. Views fetch the records they need through the appropriate helper and reconcile saved records by identity. <code>ProjectSyncEngine</code> coordinates long-lived private/shared change tracking; it does not replace normal view refreshes after edits.</p><p>Loaded <code>CKRecord</code> values act as save baselines. Existing edits use a baseline-preserving copy and surface a conflict rather than silently overwriting a newer server record. See <code>ARCHITECTURE.md</code>, <code>LinkMap/Utilities/CKUtility/</code>, and <code>LinkMap/Utilities/ProjectSync/</code> in LinkMap-core.</p></article></noscript><div id="app"></div></body></html>
