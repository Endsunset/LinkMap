<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>MapKit JS</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="`app/map.js` maintains one MapKit JS map and replaces Project Location annotations when the selected Project changes. Search or coordinate selection uses a separate marker, so exploring another place does not change the Project’s annotations." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../web-handbook/index.html">Web Handbook</a></li><li><a href="../web-implementation/index.html">Web Implementation</a></li><li>MapKit JS</li></ul><p>Article</p><h1>MapKit JS</h1><p><code>app/map.js</code> maintains one MapKit JS map and replaces Project Location annotations when the selected Project changes. Search or coordinate selection uses a separate marker, so exploring another place does not change the Project’s annotations.</p></section><h2>Overview</h2><p><code>app/place-search.js</code> handles autocomplete, full search, cancellation, and keyboard-accessible results. <code>app/place-details.js</code> replaces Apple’s PlaceDetail card on selection changes. <code>app/coordinates.js</code> validates decimal latitude/longitude pairs and supports copying the current coordinate, with a manual fallback when clipboard access is unavailable.</p><p>The map loads the MapKit JS libraries it needs for the full map and services. See <code>app/README.md</code> and the corresponding modules in <code>app/</code>.</p></article></noscript><div id="app"></div></body></html>
