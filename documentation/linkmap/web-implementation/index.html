<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Web Implementation</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="The browser app is a static JavaScript site. It reuses shared CloudKit authentication, reads Project and Location data, and owns one MapKit JS map instance. Focused modules handle the Project selector, search, place detail, and coordinates." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../web-handbook/index.html">Web Handbook</a></li><li>Web Implementation</li></ul><p>API Collection</p><h1>Web Implementation</h1><p>The browser app is a static JavaScript site. It reuses shared CloudKit authentication, reads Project and Location data, and owns one MapKit JS map instance. Focused modules handle the Project selector, search, place detail, and coordinates.</p></section><h2>Topics</h2><h3>Application</h3><ul><li><a href="../web-architecture/index.html"><p>Web Architecture</p></a><p><code>app/index.html</code> is the map page. <code>app/app.js</code> owns the selected Project, Project list, and visible Locations. It coordinates authentication, loading, selection, retries, and updates to the map and selector. A request version discards responses that arrive after a Project switch, sign-out, or retry.</p></li><li><a href="../cloudkit-js/index.html"><p>CloudKit JS</p></a><p><code>cloudkit-auth.js</code> owns one shared authentication lifecycle for website pages and exposes a verified session state to the map. <code>app/cloudkit.js</code> reuses that container and chooses the private or shared database explicitly.</p></li><li><a href="../mapkit-js/index.html"><p>MapKit JS</p></a><p><code>app/map.js</code> maintains one MapKit JS map and replaces Project Location annotations when the selected Project changes. Search or coordinate selection uses a separate marker, so exploring another place does not change the Project’s annotations.</p></li></ul><h3>Publishing</h3><ul><li><a href="../deployment/index.html"><p>Deployment</p></a><p>LinkMap is a static GitHub Pages site served below <code>/LinkMap/</code>. Website page links use relative clean directory URLs. The web map, account, and login pages are checked-in HTML, CSS, and JavaScript.</p></li></ul></article></noscript><div id="app"></div></body></html>
