<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>MapKit on iOS</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="`MapView` uses SwiftUI’s MapKit `Map` and `MapReader`. `MapViewModel` supplies the camera, Project Locations, selected Activity routes, Assignment filtering, and the current editing state." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../ios-handbook/index.html">iOS Handbook</a></li><li><a href="../ios-implementation/index.html">iOS Implementation</a></li><li>MapKit on iOS</li></ul><p>Article</p><h1>MapKit on iOS</h1><p><code>MapView</code> uses SwiftUI’s MapKit <code>Map</code> and <code>MapReader</code>. <code>MapViewModel</code> supplies the camera, Project Locations, selected Activity routes, Assignment filtering, and the current editing state.</p></section><h2>Overview</h2><p>The map can show a Project without an Activity. Selecting an Activity adds its route overlays; selecting an Assignment narrows the visible route and Locations. Region and Layer context determines which places and areas are in view. Location relocation and area editing use a map editing session: interactions update a draft, Save persists it, and Cancel restores the stored record.</p><p>Search and selection are map-owned so choosing a place does not rewrite Project data. See <code>LinkMap/Views/Map/MapView.swift</code>, <code>LinkMap/Utilities/Model/MapViewModel.swift</code>, and <code>LinkMap/Utilities/Model/MapEditingSession.swift</code> in LinkMap-core.</p></article></noscript><div id="app"></div></body></html>
