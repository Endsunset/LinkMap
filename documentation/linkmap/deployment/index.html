<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Deployment</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="LinkMap is a static GitHub Pages site served below `/LinkMap/`. Website page links use relative clean directory URLs. The web map, account, and login pages are checked-in HTML, CSS, and JavaScript." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../web-handbook/index.html">Web Handbook</a></li><li><a href="../web-implementation/index.html">Web Implementation</a></li><li>Deployment</li></ul><p>Article</p><h1>Deployment</h1><p>LinkMap is a static GitHub Pages site served below <code>/LinkMap/</code>. Website page links use relative clean directory URLs. The web map, account, and login pages are checked-in HTML, CSS, and JavaScript.</p></section><h2>Overview</h2><p>Documentation is generated from the single <code>docc/LinkMap.docc</code> catalog with <code>python3 scripts/build-documentation.py</code>. The build uses DocC’s <code>/LinkMap</code> hosting base path, checks warnings as errors, and commits its static output. DocC’s article URLs live under <code>/LinkMap/documentation/linkmap/</code>; <code>/LinkMap/documentation/</code> is the stable entry URL. The <code>.nojekyll</code> file lets GitHub Pages serve DocC’s files directly.</p><p>Run <code>python3 tests/documentation.py</code> and <code>git diff --check</code> after rebuilding. For website behavior, run the relevant JavaScriptCore tests described in <code>app/README.md</code>. Check the published site in a browser after deployment, especially search, sign-in, and assets under the GitHub Pages base path.</p></article></noscript><div id="app"></div></body></html>
