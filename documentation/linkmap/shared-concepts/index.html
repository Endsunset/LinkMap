<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Shared Concepts</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Both platforms refer to the same Project and Location data. The iOS app manages the full workflow; the web map reads the Project and places available to the signed-in account." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Shared Concepts</li></ul><p>API Collection</p><h1>Shared Concepts</h1><p>Both platforms refer to the same Project and Location data. The iOS app manages the full workflow; the web map reads the Project and places available to the signed-in account.</p></section><h2>Topics</h2><h3>Data and Access</h3><ul><li><a href="../projects-and-activities/index.html"><p>Projects and Activities</p></a><p>A Project is the long-lived workspace for a map and repeated work. It owns reusable Regions, Layers, Locations, Items, and Inventory. An Activity is a shorter work cycle inside the Project, with its own Assignments, Routes, Stops, and resource history.</p></li><li><a href="../places-and-routes/index.html"><p>Places and Routes</p></a><p>Locations are reusable places in a Project. Regions group broad areas, while Layers describe levels or surfaces within them. A Route belongs to one Activity and orders Stops; each Stop points to a Project Location.</p></li><li><a href="../collaboration/index.html"><p>Collaboration</p></a><p>A Project is the unit of sharing. Its owner can invite collaborators to the same Project, including its map and active Activity data. A collaborator accepts a link or scans a QR code in the iOS app, then chooses the shared Project in Context.</p></li></ul></article></noscript><div id="app"></div></body></html>
