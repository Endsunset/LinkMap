<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>SwiftUI Architecture</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="`MapView` is the app’s primary route. It owns map presentation, the selected Project/Activity/Assignment context, and the coordination of Dashboard, creation, scanner, style, and Location detail sheets. `MapContextController` keeps the three selections consistent: changing Project clears Activity and Assignment; changing Activity clears Assignment." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../handbook/index.html">Handbook</a></li><li><a href="../ios-handbook/index.html">iOS Handbook</a></li><li><a href="../ios-implementation/index.html">iOS Implementation</a></li><li>SwiftUI Architecture</li></ul><p>Article</p><h1>SwiftUI Architecture</h1><p><code>MapView</code> is the app’s primary route. It owns map presentation, the selected Project/Activity/Assignment context, and the coordination of Dashboard, creation, scanner, style, and Location detail sheets. <code>MapContextController</code> keeps the three selections consistent: changing Project clears Activity and Assignment; changing Activity clears Assignment.</p></section><h2>Overview</h2><p><code>MapViewModel</code> owns map state such as camera, visible Locations, route overlays, and editing sessions. Project and Activity list/detail views own their displayed arrays and refresh them through the matching CloudKit helper. <code>ProjectDetail</code> provides the Project browser and its current selections. This keeps state close to the screen that presents it.</p><p>When an edit starts, a model’s loaded record is the baseline. Save persists the edited copy and replaces that baseline only after CloudKit accepts it; Cancel restores the stored values. See <code>UX.md</code>, <code>WORKFLOW.md</code>, <code>LinkMap/Views/Map/MapView.swift</code>, and <code>LinkMap/Utilities/Model/MapContextController.swift</code> in LinkMap-core.</p></article></noscript><div id="app"></div></body></html>
