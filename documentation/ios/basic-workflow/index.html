<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Basic Workflow Example</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Follow one Project from a first place to a planned visit." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">iOS</a></li><li><a href="../how-linkmap-works/index.html">How LinkMap Works</a></li><li>Basic Workflow Example</li></ul><p>Article</p><h1>Basic Workflow Example</h1><p>Follow one Project from a first place to a planned visit.</p></section><h2>Overview</h2><ol><li><p>From the Map, open Dashboard → Add Project. Give the Project a name.</p></li><li><p>Open Dashboard → Context and select the new Project.</p></li><li><p>Open Dashboard → Current Project. Add the Locations the team needs to visit. Use Regions and Layers if the area has distinct sections or levels.</p></li><li><p>Create an Activity for the upcoming visit. Add a Route using the Project Locations as Stops, then create an Assignment for the person or team following it.</p></li><li><p>Select the Activity and optional Assignment in Context. Return to the Map to follow the route and open Location details.</p></li><li><p>When the work is over, archive the Activity. Keep the Project and its places for the next visit.</p></li></ol></article></noscript><div id="app"></div></body></html>
