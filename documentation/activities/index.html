<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Activities</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="An Activity is one round of work within a Project." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Activities</li></ul><p>LinkMap Guide</p><h1>Activities</h1><p>An Activity is one round of work within a Project.</p></section><h2>Overview</h2><p>Create an Activity when you are ready to plan a visit, inspection, or other task. Add Routes for the places to visit and Assignments for the people or teams doing the work. Select the Activity in Dashboard → Context to show its route on the Map.</p><p>Archive an Activity after the work is finished. The Project and its Locations remain ready for another Activity.</p><h2>Topics</h2><h3>Plan an Activity</h3><ul><li><a href="../routes-and-stops/index.html"><p>Routes and Stops</p></a><p>A Route puts places in the order your team should visit them. Each Stop uses a Location from the Project.</p></li><li><a href="../assignments/index.html"><p>Assignments</p></a><p>An Assignment names the person, team, crew, or vehicle responsible for work in an Activity.</p></li></ul></article></noscript><div id="app"></div></body></html>
