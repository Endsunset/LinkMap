<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Collaboration</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="A Project is the unit of sharing. Its owner can invite collaborators to the same Project, including its map and active Activity data. A collaborator accepts a link or scans a QR code in the iOS app, then chooses the shared Project in Context." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../shared-concepts/index.html">Shared Concepts</a></li><li>Collaboration</li></ul><p>Article</p><h1>Collaboration</h1><p>A Project is the unit of sharing. Its owner can invite collaborators to the same Project, including its map and active Activity data. A collaborator accepts a link or scans a QR code in the iOS app, then chooses the shared Project in Context.</p></section><h2>Overview</h2><p>The web app can read Projects that are available to the signed-in Apple Account, including accepted shared Projects. When access ends, the shared Project disappears after the available Project list refreshes.</p></article></noscript><div id="app"></div></body></html>
