<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>LinkMap Documentation</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Learn how to organize places and work in LinkMap on iOS and the web." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li>LinkMap</li></ul><p>LinkMap Guide</p><h1>LinkMap</h1><p>Learn how to organize places and work in LinkMap on iOS and the web.</p></section><h2>Overview</h2><p>Start with Platforms to see how the two apps differ, then open the Handbook for step-by-step help. Essentials gives a short introduction, and Shared Concepts covers Projects, places, routes, and sharing.</p><h2>Topics</h2><h3>Platforms</h3><ul><li><a href="platforms/index.html"><p>Platforms</p></a><p>LinkMap is available as an iOS app and a web map. Both can show the Projects and places available to you, but account access and available actions differ.</p></li></ul><h3>Handbook</h3><ul><li><a href="handbook/index.html"><p>Handbook</p></a><p>Follow the existing iOS guides for setting up Projects, organizing places, planning work, and sharing. For differences between the iOS app and web map, see <a href="platforms/index.html">Platforms</a>.</p></li></ul><h3>Essentials</h3><ul><li><a href="essentials/index.html"><p>Essentials</p></a><p>LinkMap centers on a Project: a shared map and a collection of Activities. Places remain available across Activities, so a team can plan another round of work without recreating its map.</p></li></ul><h3>Shared Concepts</h3><ul><li><a href="shared-concepts/index.html"><p>Shared Concepts</p></a><p>Projects and Locations appear in both the iOS app and the web map. Use the iOS app to manage them, then open the web map to explore the places available to your account.</p></li></ul></article></noscript><div id="app"></div></body></html>
