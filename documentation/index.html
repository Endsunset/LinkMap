<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>LinkMap Documentation</title><script>var baseUrl = "/LinkMap/"</script><script defer="defer" src="/LinkMap/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/js/index.f7bc5188.js"></script><link href="/LinkMap/css/index.63be42cf.css" rel="stylesheet"><meta content="Learn how to organize places and work in LinkMap on iOS and the web." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li>LinkMap</li></ul><p>LinkMap Guide</p><h1>LinkMap</h1><p>Learn how to organize places and work in LinkMap on iOS and the web.</p></section><h2>Overview</h2><p>Start with Platforms to see how the two apps differ. The task sections below cover getting started, Projects and the Map, planning work, and collaboration. Essentials provides a short introduction.</p><h2>Topics</h2><h3>Platforms</h3><ul><li><a href="web-platform/index.html"><p>LinkMap for Web</p></a><p>The web map asks you to sign in with your Apple Account to view your Projects and their Locations. Sign-in is a separate step in the browser, even if you already use LinkMap on iOS.</p></li><li><a href="ios-platform/index.html"><p>LinkMap for iOS</p></a><p>The iOS app uses the Apple Account signed in on your device for iCloud access. You do not need to sign in separately inside LinkMap.</p></li></ul><h3>Start Here</h3><ul><li><a href="using-linkmap-for-ios/index.html"><p>Get Started on iOS</p></a><p>Use LinkMap to plan places and shared work from the Map.</p></li><li><a href="basic-workflow/index.html"><p>Basic Workflow Example</p></a><p>Follow one Project from a first place to a planned visit.</p></li></ul><h3>Project and Map</h3><ul><li><a href="project/index.html"><p>Project</p></a><p>A Project brings together the places and activities for one area or shared effort.</p></li><li><a href="map/index.html"><p>Map</p></a><p>The Map is the first screen in LinkMap. It stays visible even before you choose a Project.</p></li></ul><h3>Plan Work</h3><ul><li><a href="activities/index.html"><p>Activities</p></a><p>An Activity is one round of work within a Project.</p></li></ul><h3>Collaborate</h3><ul><li><a href="sharing/index.html"><p>Sharing</p></a><p>Share a Project when other people need to see and work with the same places and Activities.</p></li></ul><h3>Essentials</h3><ul><li><a href="essentials/index.html"><p>Essentials</p></a><p>LinkMap centers on a Project: a shared map and a collection of Activities. Places remain available across Activities, so a team can plan another round of work without recreating its map.</p></li></ul></article></noscript><div id="app"></div></body></html>
