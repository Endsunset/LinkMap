<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Activities</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="An Activity is one cycle of work within a Project." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Activities</li></ul><p>Article</p><h1>Activities</h1><p>An Activity is one cycle of work within a Project.</p></section><h2>Overview</h2><p>Create an Activity after its Project foundation is ready. Assignments and Routes belong to that Activity; Routes contain ordered Stops that point to Project Locations. Resource movements can flow from Inventory to Activity and then among Activity, Assignment, and Stop anchors.</p><p>Archiving makes the Activity historical. The owner can archive it even when the Project is not actively shared. Archived Activity resource history remains readable.</p><ul><li><p><a href="../routes-and-stops/index.html">Routes and Stops</a></p></li><li><p><a href="../assignments-and-resources/index.html">Assignments and Resources</a></p></li></ul></article></noscript><div id="app"></div></body></html>
