<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Selected Model Reference</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="These selected native model declarations clarify the records behind the conceptual guides. They are internal implementation types, not a public SDK contract. This curated reference intentionally does not publish every symbol discovered in the app target." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Selected Model Reference</li></ul><p>Article</p><h1>Selected Model Reference</h1><p>These selected native model declarations clarify the records behind the conceptual guides. They are internal implementation types, not a public SDK contract. This curated reference intentionally does not publish every symbol discovered in the app target.</p></section><h2>`ProjectModel`</h2><p><code>ProjectModel</code> is an observable, identifiable wrapper for a Project record. <code>recordID</code> provides stable identity, <code>name</code> is editable, <code>restoreFieldsFromRecord()</code> discards unsaved name edits, and <code>toCKRecord()</code> creates a baseline-preserving record for save. Source: <code>LinkMap/Models/CKRecord/ProjectModel.swift</code> in LinkMap-core.</p><h2><code>ActivityModel</code></h2><p><code>ActivityModel</code> records the Project’s work cycle. Its <code>isArchived</code> property is true when a loaded Activity record has no parent. <code>toCKRecord(parentProjectID:)</code> writes the Project reference and parent relationship for active Activities. Source: <code>LinkMap/Models/CKRecord/ActivityModel.swift</code> in LinkMap-core.</p><h2><code>TransactionModel</code></h2><p><code>TransactionModel</code> carries <code>itemReference</code>, optional <code>fromReference</code> and <code>toReference</code>, positive <code>quantity</code>, and <code>note</code>. <code>createdAt</code> and <code>modifiedAt</code> come from CloudKit record metadata. <code>applyFields(to:)</code> writes mutable fields to a record; flow validation and directional uniqueness are handled by the owning CloudKit workflow. Source: <code>LinkMap/Models/CKRecord/TransactionModel.swift</code> in LinkMap-core.</p></article></noscript><div id="app"></div></body></html>
