<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Locations</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="Locations are reusable Project places: entrances, rooms, checkpoints, stations, or delivery points." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Locations</li></ul><p>Article</p><h1>Locations</h1><p>Locations are reusable Project places: entrances, rooms, checkpoints, stations, or delivery points.</p></section><h2>Overview</h2><p>Each Location has a coordinate and can reference a Region and Layer. A Location can also describe an area with vertices. Routes reuse Project Locations as Stops, so changes to the Project map can support later Activities.</p><p>From the Map, use Edit Locations to create or move a Location. Tap a marker and choose Detail to inspect it. Explicit Save persists edits through CloudKit; Cancel restores the stored values.</p><ul><li><p><a href="../routes-and-stops/index.html">Routes and Stops</a></p></li></ul></article></noscript><div id="app"></div></body></html>
