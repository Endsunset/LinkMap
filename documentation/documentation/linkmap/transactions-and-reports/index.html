<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Transactions and Reports</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="A Transaction records a positive quantity of one Item moving between resource anchors. Inventory, Activity, Assignment, and Stop are anchors; a balance equals incoming quantities minus outgoing quantities." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Transactions and Reports</li></ul><p>Article</p><h1>Transactions and Reports</h1><p>A Transaction records a positive quantity of one Item moving between resource anchors. Inventory, Activity, Assignment, and Stop are anchors; a balance equals incoming quantities minus outgoing quantities.</p></section><h2>Allowed Movements</h2><p>Project-level movements connect Outside and Inventory, two Inventories, or Inventory and Activity. Activity-level movements connect Activity, Assignment, and Stop anchors belonging to the same Activity. Item and directional endpoints identify a Transaction; an existing direction must be selected explicitly before editing its quantity or note.</p><p>Use the Activity Dashboard for stop work and resource pivots to review balances and history. Assignment reports summarize current routes and net Stop balances; regenerate a report when the underlying work changes.</p><ul><li><p><a href="../model-reference/index.html">Selected Model Reference</a></p></li></ul></article></noscript><div id="app"></div></body></html>
