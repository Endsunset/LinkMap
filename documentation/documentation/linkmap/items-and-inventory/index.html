<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Items and Inventory</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="An Item names a resource that may be carried, delivered, used, or counted. Inventory is a Project resource anchor for those Items." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Items and Inventory</li></ul><p>Article</p><h1>Items and Inventory</h1><p>An Item names a resource that may be carried, delivered, used, or counted. Inventory is a Project resource anchor for those Items.</p></section><h2>Overview</h2><p>Add Items once in the Project. Use Inventory for stock locations, then move quantities with Transactions. An Item’s quantity is derived from incoming minus outgoing Transactions for the selected anchor; it is not stored directly on the Item or Inventory.</p><p>Inventory supports adding from or removing to Outside, transferring between Inventories, and supplying an Activity. The allowed flow depends on both endpoints.</p><ul><li><p><a href="../transactions-and-reports/index.html">Transactions and Reports</a></p></li></ul></article></noscript><div id="app"></div></body></html>
