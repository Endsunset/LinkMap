<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Sharing</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="Sharing grants collaborators access to a whole Project and its active child records." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Sharing</li></ul><p>Article</p><h1>Sharing</h1><p>Sharing grants collaborators access to a whole Project and its active child records.</p></section><h2>Overview</h2><p>Start collaboration from Project tools and send a LinkMap collaboration link or show its QR code. A collaborator can open the link or use Dashboard → Scan, then refresh Projects and select the shared Project in Context. The Project is the CloudKit share root, so its map, resources, and Activities stay together.</p><p>After access is removed, the shared Project disappears from a collaborator’s refreshed Project list.</p><ul><li><p><a href="../architecture/index.html">Architecture</a></p></li></ul></article></noscript><div id="app"></div></body></html>
