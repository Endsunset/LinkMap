<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Project</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="A Project is the shared workspace and CloudKit share root for its map, Items, Inventory, Activities, and history." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Project</li></ul><p>Article</p><h1>Project</h1><p>A Project is the shared workspace and CloudKit share root for its map, Items, Inventory, Activities, and history.</p></section><h2>Overview</h2><p>Open Dashboard → Current Project after selecting a Project in Context. Projects can be private or shared with collaborators. A Project keeps reusable foundation records separate from shorter Activity cycles.</p><h2>Structure</h2><ul><li><p>Regions and Layers organize the map.</p></li><li><p>Locations describe places on that map.</p></li><li><p>Items identify reusable resources; Inventory holds their balances through Transactions.</p></li><li><p>Activities organize Assignments, Routes, Stops, and work history.</p></li><li><p><a href="../architecture/index.html">Architecture</a></p></li><li><p><a href="../sharing/index.html">Sharing</a></p></li></ul></article></noscript><div id="app"></div></body></html>
