<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Basic Workflow Example</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="Follow one Project from setup through a completed Activity." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Basic Workflow Example</li></ul><p>Article</p><h1>Basic Workflow Example</h1><p>Follow one Project from setup through a completed Activity.</p></section><h2>Overview</h2><ol><li><p>From the Map, open Dashboard → Add Project. Create the Project, then select it from Dashboard → Context.</p></li><li><p>Open Dashboard → Current Project. Add Regions, Layers, and Locations for the area where work will happen. Add reusable Items and an Inventory.</p></li><li><p>Create an Activity for this work cycle. Add Assignments for teams and Routes that use Project Locations as ordered Stops.</p></li><li><p>In the Activity supply workflow, move Items from Inventory into the Activity and then into Assignments. Transactions record these movements; balances are derived from them.</p></li><li><p>Select the Activity in Context. Follow its routes on the Map, use the Activity Dashboard for stop work, and review resource history and the Assignment report.</p></li><li><p>Archive the Activity when it becomes historical. Reuse the same Project map and Items for the next Activity.</p></li></ol><ul><li><p><a href="../transactions-and-reports/index.html">Transactions and Reports</a></p></li></ul></article></noscript><div id="app"></div></body></html>
