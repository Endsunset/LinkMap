<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Map</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="The Map is the iOS app’s launch screen and stays visible even when no Project is selected." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Map</li></ul><p>Article</p><h1>Map</h1><p>The Map is the iOS app’s launch screen and stays visible even when no Project is selected.</p></section><h2>Overview</h2><p>Use Dashboard → Context to select a Project, Activity, and Assignment. A selected Project loads its Locations. A selected Activity adds its Routes; an Assignment narrows markers and route overlays to that team’s work. The Map also offers place search and map style controls.</p><p>Tap a Location marker to open its actions, then choose Detail. Use Edit Locations from the Map toolbar’s ellipsis to add or move places. Map changes are saved explicitly; Cancel restores the last stored record.</p><ul><li><p><a href="../locations/index.html">Locations</a></p></li><li><p><a href="../regions-and-layers/index.html">Regions and Layers</a></p></li></ul></article></noscript><div id="app"></div></body></html>
