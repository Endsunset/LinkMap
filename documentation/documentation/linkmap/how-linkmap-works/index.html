<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>How LinkMap Works</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="A Project holds the long-lived map and resources. An Activity holds one cycle of work within that Project." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>How LinkMap Works</li></ul><p>Article</p><h1>How LinkMap Works</h1><p>A Project holds the long-lived map and resources. An Activity holds one cycle of work within that Project.</p></section><h2>The Main Loop</h2><p>LinkMap opens on the Map. Open Dashboard → Context to choose a Project, Activity, and optional Assignment. Choosing a new Project clears the previous Activity and Assignment; choosing a new Activity clears the Assignment. Dashboard also opens the current Project and Activity details.</p><p>Build the Project foundation first: Regions, Layers, Locations, Items, and Inventory. Then create an Activity with Assignments and Routes. Follow the Routes on the Map, record resource movements through Transactions, and review the resulting balances and reports.</p><h2>Why the Separation Matters</h2><p>A Location or Item can be reused across many Activities. Routes, Stops, Assignments, and Activity resource movements belong to a specific Activity. Archiving an Activity preserves its history while the Project remains available for the next round.</p><ul><li><p><a href="../project/index.html">Project</a></p></li><li><p><a href="../activities/index.html">Activities</a></p></li><li><p><a href="../architecture/index.html">Architecture</a></p></li></ul></article></noscript><div id="app"></div></body></html>
