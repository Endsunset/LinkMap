<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/LinkMap/documentation/favicon.ico"><link rel="mask-icon" href="/LinkMap/documentation/favicon.svg" color="#333333"><title>Architecture</title><script>var baseUrl = "/LinkMap/documentation/"</script><script defer="defer" src="/LinkMap/documentation/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/LinkMap/documentation/js/index.f7bc5188.js"></script><link href="/LinkMap/documentation/css/index.63be42cf.css" rel="stylesheet"><meta content="LinkMap uses private and shared CloudKit databases with one `projectZone-*` zone and one Project share root per Project." name="description"/><link rel="stylesheet" href="/LinkMap/documentation/doc-theme.css"></head><body data-color-scheme="light"><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Architecture</li></ul><p>Article</p><h1>Architecture</h1><p>LinkMap uses private and shared CloudKit databases with one <code>projectZone-*</code> zone and one Project share root per Project.</p></section><h2>Record Ownership</h2><pre class="text"><code>Project
├── Region, Layer, Location
├── Item, Inventory, Project Transaction
└── Activity
    ├── Assignment
    ├── Route → Stop
    └── Activity Transaction
</code></pre><p>The Project foundation is reusable. Activity children describe one work cycle. Transactions are parented according to their endpoints and carry an Item, positive quantity, optional source and destination, note, and Project reference. Endpoint references do not change record ownership.</p><h2>State Boundaries</h2><p>The Map owns map context, selection, editing, and camera state. List and detail views own their displayed data and refresh through the matching CloudKit utility. Loaded model records serve as the baseline for edits; saving preserves that baseline until CloudKit accepts the change.</p><p>For implementation details, consult <code>ARCHITECTURE.md</code> in the native LinkMap-core repository.</p><ul><li><p><a href="../model-reference/index.html">Selected Model Reference</a></p></li></ul></article></noscript><div id="app"></div></body></html>
