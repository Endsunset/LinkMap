<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Apple Maps with LinkMap.">
  <title>Map | LinkMap</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="../components/notification/notification.css">
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js" async></script>
  <script src="../components/notification/notification.js" defer></script>
  <script src="../shared/errors/cloudkit-errors.js" defer></script>
  <script src="../cloudkit-config.js" defer></script>
  <script src="../cloudkit-auth.js" defer></script>
  <script src="../shared/errors/mapkit-errors.js" defer></script>
</head>
<body class="map-page">
<!-- Shared header: edit components/header.html, then run scripts/build-headers.py -->
<header draggable="false" class="site-header">
  <a draggable="false" class="brand" href="../" aria-label="LinkMap home">
    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    <span>LinkMap</span>
  </a>
  <nav class="nav-links" aria-label="Main navigation">
    <a draggable="false" class="desktop-nav-link" href="../docs/">Documentation</a>
    <a draggable="false" class="desktop-nav-link" href="../download/">Download</a>
    <a draggable="false" class="button button-small button-outline" href="../login/" data-header-sign-in>Sign in</a>
    <a draggable="false" class="button button-small button-outline" href="../account/" data-account-link hidden>Account</a>
    <button class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-navigation" popovertarget="mobile-navigation">
      <span></span><span></span>
    </button>
  </nav>
  <nav id="mobile-navigation" class="mobile-navigation" popover aria-label="Mobile navigation">
    <a draggable="false" href="../docs/">Documentation</a>
    <a draggable="false" href="../download/">Download</a>
  </nav>
</header>
<script src="../header.js"></script>
<!-- End shared header -->
  <main class="map-workspace" aria-label="LinkMap map">
    <section class="project-toolbar" aria-label="Project selection">
      <div class="project-field">
        <label for="project-select">Project</label>
        <select id="project-select" aria-describedby="project-status" disabled>
          <option value="">Loading projects…</option>
        </select>
      </div>
      <p id="project-status" role="status" aria-live="polite">Connecting to iCloud…</p>
      <button id="project-retry" class="button button-small button-outline" type="button" hidden>Try again</button>
      <a id="project-sign-in" class="button button-small button-outline" href="../login/" hidden>Sign in</a>
    </section>
    <div class="map-canvas">
      <div id="map" aria-label="Interactive Apple map"></div>
      <div id="map-loading" class="map-notice" role="status">Loading Apple Maps…</div>
      <noscript><p class="map-notice">Enable JavaScript to use the interactive map.</p></noscript>
    </div>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
